<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starter Story LATAM - Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Starter Story <span class="accent">LATAM</span></h2>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <h3>INICIO</h3>
                    <a href="#/" class="nav-item active" data-route="/">Dashboard</a>
                </div>
                <div class="nav-section">
                    <h3>FASE 1 — SCRAPING</h3>
                    <a href="#/scraper" class="nav-item" data-route="/scraper">Scraper & Logs</a>
                    <a href="#/videos" class="nav-item" data-route="/videos">Videos</a>
                </div>
                <div class="nav-section">
                    <h3>FASE 3 — CLASIFICACIÓN</h3>
                    <a href="#/pain-points" class="nav-item" data-route="/pain-points">Pain Points LATAM</a>
                    <a href="#/wizard" class="nav-item" data-route="/wizard">Wizard RPM</a>
                </div>
                <div class="nav-section">
                    <h3>FASE 4 — SOLUCIONES</h3>
                    <a href="#/solutions" class="nav-item" data-route="/solutions">Motor de Soluciones</a>
                </div>
                <div class="nav-section">
                    <h3>FASE 5 — VALIDACIÓN</h3>
                    <a href="#/mvt" class="nav-item" data-route="/mvt">MVT</a>
                </div>
                <div class="nav-section">
                    <h3>SISTEMA</h3>
                    <a href="#/settings" class="nav-item" data-route="/settings">Ajustes</a>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <h1 id="page-title">Dashboard</h1>
            </header>
            <div id="app-content" class="content-container">
                <!-- Dynamically injected by app.js -->
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
